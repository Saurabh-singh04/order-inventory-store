# Runs SQL Server, the API and the Angular frontend:
#   cp .env.example .env   (then set your own values)
#   docker compose up --build
# Frontend: http://localhost:8080   API: http://localhost:8080/api   Swagger: http://localhost:8080/swagger

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "14333:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=db,1433;Database=StoreDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Seed__Enabled: "true"
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-Admin@123}
      Seed__CustomerPassword: ${SEED_CUSTOMER_PASSWORD:-Customer@123}
      ForwardedHeaders__Enabled: "true"
    # No published port on purpose: the API is only reachable through the frontend's nginx,
    # which sets X-Forwarded-For. Publishing it would let clients send their own
    # X-Forwarded-For and dodge the per-IP login rate limit.
    expose:
      - "8080"

  frontend:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  sqldata:
